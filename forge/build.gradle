buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Make sure this version matches the one included in Kotlin for Forge
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
        // OPTIONAL Gradle plugin for Kotlin Serialization
        classpath 'org.jetbrains.kotlin:kotlin-serialization:1.9.22'
    }
}

plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "org.jetbrains.kotlin.jvm"
    id "com.matthewprenger.cursegradle"
    id "com.modrinth.minotaur"
}

apply from: '../gradle-scripts/publish-curseforge.gradle'

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    main {
        resources {
            srcDir "$buildDir/generated/resources"
        }
    }
}

// Read outside the loom block: inside it, `rootProject` resolves against Loom's extension rather than
// the Gradle project.
def vsSodiumRuntime = rootProject.sodium_runtime

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // Autotest passthrough: `-Pvs_autotest=<script>` hands the script path to the client, where
    // VsAutoTestHarness drives it. Absent the property the harness never installs itself.
    // `-Pvs_rundir=<name>` gives this client its own run directory, so two runtimes can be exercised
    // in parallel without fighting over forge/run's logs, screenshots and config.
    if (project.hasProperty('vs_rundir')) {
        runs.configureEach {
            runDir project.property('vs_rundir').toString()
        }
    }

    if (project.hasProperty('vs_autotest')) {
        runs.configureEach {
            property("vs.autotest", project.property('vs_autotest').toString())
        }
    }

    // `-Pvs_floodtrace=true` turns on VsGpuLightFlood's per-frame state trace, which logs only when the
    // flood's inputs change — the thing to line up against a screenshot burst when chasing flicker.
    if (project.hasProperty('vs_floodtrace')) {
        runs.configureEach {
            property("vs.floodtrace", project.property('vs_floodtrace').toString())
        }
    }

    // `-Pvs_floodbench=N` — see VsGpuLightFlood.BENCH.
    if (project.hasProperty('vs_floodbench')) {
        runs.configureEach {
            property("vs.floodbench", project.property('vs_floodbench').toString())
        }
    }

    // `-Pvs_gputime` — GL timer queries around the chunk terrain passes. See VsGpuTimer.
    if (project.hasProperty('vs_gputime')) {
        runs.configureEach {
            property("vs.gputime", "true")
        }
    }

    // `-Pvs_aogate=off` — disable the no-occluders AO gate, to measure what it is worth.
    if (project.hasProperty('vs_aogate')) {
        runs.configureEach {
            property("vs.aogate", project.property('vs_aogate').toString())
        }
    }

    // `-Pvs_aotime` — report the seam AO's CPU cost per frame. See VsDynamicLight.AO_TIME.
    if (project.hasProperty('vs_aotime')) {
        runs.configureEach {
            property("vs.aotime", "true")
        }
    }

    // `-Pvs_aoprof=N` — bisect the per-fragment seam AO by making it return early at stage N.
    // See VS_AOPROF in the chunk fragment shaders.
    if (project.hasProperty('vs_aoprof')) {
        runs.configureEach {
            property("vs.aoprof", project.property('vs_aoprof').toString())
        }
    }

    // `-Pvs_seamkernel=N` — which B-spline the seam AO splats occluder voxels with: 1 tent (default,
    // the verified field), 2 quadratic, 3 cubic. 2 and 3 SHADE DIFFERENTLY; they exist to measure
    // what a smoother kernel costs. See VS_SEAM_KERNEL in the chunk fragment shaders.
    if (project.hasProperty('vs_seamkernel')) {
        runs.configureEach {
            property("vs.seamkernel", project.property('vs_seamkernel').toString())
        }
    }

    if (vsSodiumRuntime == "backport") {
        // Sodium refuses to start when the running LWJGL differs from the one it was compiled against.
        // The version pin below reaches this module's runtimeClasspath, but Forge's dev launch classpath
        // is assembled by Loom outside it and still supplies 3.3.2 against Sodium's 3.3.1. That is a
        // patch-level difference, so opt out of the check for the dev run rather than fighting Loom's
        // library provisioning. Sodium documents this switch; see BugChecks.ISSUE_2561.
        runs.configureEach {
            property("sodium.checks.issue2561", "false")
        }
    }

    forge {
        mixinConfig "valkyrienskies-common.mixins.json"
        mixinConfig "valkyrienskies-forge.mixins.json"
        convertAccessWideners.set(true)
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }
    mixin {
        defaultRefmapName = "valkyrienskies-refmap.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    core
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    compileClasspath.extendsFrom core
    forgeRuntimeLibrary.extendsFrom core
    shadowCommon.extendsFrom core
}

// Sodium's pre-launch check refuses to start when the running LWJGL differs from the one it was
// compiled against (BuildConfig.LWJGL_VERSION over in the backport, and the version 1.20.1 itself
// ships). Something on this module's runtime classpath declares 3.3.2 and wins conflict resolution,
// so pin the whole group back to what vanilla uses. Scoped to the backport runtime, since the legacy
// Sodium/Embeddium dev setup has no such check and is known to work as-is.
if (rootProject.sodium_runtime == "backport") {
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == "org.lwjgl") {
                    details.useVersion("3.3.1")
                }
            }
        }
    }
}

dependencies {
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))
    annotationProcessor("net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5") // use fabric mixin so we can write interface injectors (conditionally loaded if mixinbooster is enabled)

    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    common(project(path: ":common", configuration: "namedElements")) {
        transitive = false
    }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) {
        transitive = false
    }

    modCompileOnly("maven.modrinth:embeddium:${embeddium_version}")
    compileOnly("net.caffeinemc:sodium-forge:${rootProject.sodium_backport_version}:dev")

    // Which Sodium the dev client runs with. See the fabric module for why this is the `dev` artifact
    // consumed as a plain runtimeOnly: the production jar is reobfuscated to SRG and carries a refmap
    // that translates its mixins the same way, neither of which a Mojang-named dev environment wants.
    if (rootProject.sodium_runtime == "backport") {
        runtimeOnly("net.caffeinemc:sodium-forge:${rootProject.sodium_backport_version}:dev")
    } else if (rootProject.sodium_runtime == "legacy") {
        modRuntimeOnly("maven.modrinth:embeddium:${embeddium_version}")
    }
    //modRuntimeOnly("maven.modrinth:embeddium:${embeddium_version}")
    modCompileOnly("maven.modrinth:oculus:${oculus_version}")

    modRuntimeOnly("maven.modrinth:forge-config-screens:v8.0.2-1.20.1-Forge")

    // Twilight Forest
    modCompileOnly("teamtwilight:twilightforest:${twilightforest_version}:universal")
    //modRuntimeOnly("teamtwilight:twilightforest:${twilightforest_version}:universal")

    // CBC
    //modRuntimeOnly("com.rbasamoyai:createbigcannons:${createbigcannons_version}+mc.${minecraft_version}-forge-build.250") { transitive = false }
    //modRuntimeOnly("com.rbasamoyai:ritchiesprojectilelib:${rpl_version}+mc.${minecraft_version}-forge")


    // Create compat. Compiling against it is unconditional; LOADING it in the dev runtime is not --
    // see create_runtime in gradle.properties for why (dev launch time, paid on every autotest run).
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    modCompileOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("curse.maven:vanillin-965702:6446560")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    if (project.findProperty("create_runtime") == "true") {
        modRuntimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        modRuntimeOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
        modRuntimeOnly("curse.maven:vanillin-965702:6446560")
        modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
        modRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    } else {
        // Architectury's dev-launch transformer walks VS2's own bytecode to recompute stack frames,
        // and that needs the TYPES the Create compat classes mention to be resolvable -- not the mods
        // themselves. Without this it dies before the game starts:
        //     NoClassDefFoundError: dev/engine_room/flywheel/api/visual/Effect
        //     at dev.architectury.transformer.handler.SimpleTransformerHandler.applyTransforms
        // The API artifacts are types only, so FML has no mod to initialise and none of the load time
        // this switch exists to avoid comes back.
        runtimeOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    }

    // Weather2 1.20.1
    //modRuntimeOnly("curse.maven:weather-storms-tornadoes-237746:5244118")
    //modRuntimeOnly("curse.maven:coroutil-237749:5096038")

    // CC Tweaked
    //modRuntimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}")

    // Etched
    modCompileOnly("maven.modrinth:etched:3.0.4")

    // OpenComputers 2: Reimagined
    modCompileOnly("maven.modrinth:oc2r:${oc2r_version}")

    // EMF compat
    //todo: fix
    modCompileOnly("maven.modrinth:entity-model-features:3.0.7-forge-1.20.1")
    modCompileOnly("maven.modrinth:entitytexturefeatures:7.0.6-forge-1.20.1")

    modCompileOnly("curse.maven:vista-1368607:7929283")

    modCompileOnly("maven.modrinth:create-utilities:0.2.0+1.20.1")
    modCompileOnly("teamreborn:energy:${energy_version}") {
        transitive = false
    }
    // TIS-3d
    modCompileOnly("maven.modrinth:tis3d:${tis3d_version}")

    // Modular Routers
    modCompileOnly("curse.maven:mr-250294:4696089")

    // Modular Force Field System
    modCompileOnly("maven.modrinth:mffs:5.1.18")

    // Epic Fight
    modCompileOnly("maven.modrinth:epic-fight:20.10.3")

    // Dynmap
    modCompileOnly("maven.modrinth:dynmap:${dynmap_version}")

    // Hexcasting
    modCompileOnly("at.petra-k.hexcasting:hexcasting-forge-${minecraft_version}:${hexcasting_version}") { transitive = false }

    // HexTweaks
    modCompileOnly("maven.modrinth:hextweaks:$hextweaks_version")

    // Ephemera
    modCompileOnly("maven.modrinth:ephemera:$ephemera_version")

    // Hexal
    modCompileOnly("ram.talia.hexal:hexal-forge-$minecraft_version:$hexal_version") { transitive = false }

    // Integrated Dynamics
    modCompileOnly("curse.maven:integrated-dynamics-236307:5297722")
    modCompileOnly("curse.maven:cyclops-core-232758:5262063")
    modCompileOnly("curse.maven:common-capabilities-247007:4987207")

    // Very Many Players
    //modCompileOnly("maven.modrinth:vmp-forge:0.2.0+beta.7.101+1.20.1")

    // Mekanism
    modCompileOnly("maven.modrinth:mekanism:${mekanism_version}")
    //modRuntimeOnly("maven.modrinth:mekanism:${mekanism_version}")

    // Spark Profiler
    modRuntimeOnly ("maven.modrinth:spark:${spark_version}")

    // Connectible Chains [Forge]
    modCompileOnly("curse.maven:connectible-chains-forge-418514:6142294")
    //modRuntimeOnly("curse.maven:connectible-chains-forge-418514:6142294")


    // Add Kotlin for Forge (3.12.0)
    forgeRuntimeLibrary("maven.modrinth:kotlin-for-forge:${kotlin_version}")

    // Shade vs-core
    implementation("org.valkyrienskies.core:util:${rootProject.vs_core_version}")
    implementation("org.valkyrienskies.core:internal:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
    }
    runtimeOnly("org.valkyrienskies.core:impl:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
    }
    forgeRuntimeLibrary shadowCommon("org.valkyrienskies.core:impl:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }


    // region Manually include every single dependency of vs-core (total meme)
    forgeRuntimeLibrary include("org.valkyrienskies.core:api:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary shadowCommon("org.valkyrienskies.core:internal:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary include("org.valkyrienskies.core:util:${rootProject.vs_core_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary shadowCommon("org.valkyrienskies:physics_api_krunch:${rootProject.krunch_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary shadowCommon("org.valkyrienskies:physics_api:${rootProject.krunch_api_version}") {
        exclude group: 'org.joml', module: 'joml'
        transitive = false
    }

    forgeRuntimeLibrary include("javax.inject:javax.inject:1") { transitive = false }

    // JOML for Math
    forgeRuntimeLibrary include("org.joml:joml-primitives:1.10.0")

    // Apache Commons Math for Linear Programming
    forgeRuntimeLibrary include("org.apache.commons:commons-math3:3.6.1") { transitive = false }

    // Jackson Binary Dataformat for Object Serialization
    def jacksonVersion = '2.14.0'
    // forked to remove module-info
    forgeRuntimeLibrary include("com.fasterxml.jackson.module:jackson-module-kotlin:$jacksonVersion-rubyfork") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.module:jackson-module-parameter-names:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.dataformat:jackson-dataformat-cbor:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-annotations:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml.jackson.core:jackson-core:$jacksonVersion") { transitive = false }
    forgeRuntimeLibrary include("com.github.Rubydesic:jackson-kotlin-dsl:1.2.0") { transitive = false }

    forgeRuntimeLibrary include("com.networknt:json-schema-validator:1.0.71") { transitive = false }
    forgeRuntimeLibrary include("com.ethlo.time:itu:1.7.0") { transitive = false }
    forgeRuntimeLibrary include("com.github.victools:jsonschema-module-jackson:4.25.0") { transitive = false }
    forgeRuntimeLibrary include("com.github.victools:jsonschema-generator:4.25.0") { transitive = false }
    forgeRuntimeLibrary include("com.fasterxml:classmate:1.5.1") { transitive = false }
    forgeRuntimeLibrary include("com.flipkart.zjsonpatch:zjsonpatch:0.4.11") { transitive = false }
    forgeRuntimeLibrary include("org.apache.commons:commons-collections4:4.3") { transitive = false }

    forgeRuntimeLibrary include("com.google.dagger:dagger:2.43.2") { transitive = false }

    // endregion
}

// Copy the VS common access widener to the generated resources folder
def generatedResourcesDir = layout.buildDirectory.dir("generated/resources")

tasks.register("copyAccessWidener", Copy) {
    from(project(":common").file("src/main/resources/valkyrienskies-common.accesswidener"))
    into(generatedResourcesDir)
}

processResources {
    dependsOn("copyAccessWidener")
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    // Exclude dummy Optifine classes
    exclude "net/optifine/**"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

compileKotlin {
    kotlinOptions.jvmTarget = '17'
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    dependsOn("copyAccessWidener")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            groupId = "org.valkyrienskies"
            version = project.version
            artifactId = rootProject.archives_base_name + "-" + project.name
            // Publish the dev shadow jar to maven
            artifact(shadowJar) {
                classifier "dev-shadow"
            }
            from components.java
        }
    }
}
