# https://modrinth.com/mod/sodium/versions
sodium_version = mc1.20.1-0.5.13-fabric

# Sodium 0.9.2 backported to 1.20.1, built from ../modpack/sodium-backport and installed with
# `./gradlew publishToMavenLocal` over there. Compiled against via the forge module's `dev` jar: it
# carries Mojang names and Java 17 bytecode, so it fits every module's compile classpath, whereas the
# fabric jar is Java 21 and would be rejected under `options.release = 17`.
# The 0.9 packages are net.caffeinemc.*, so this coexists with sodium_version/embeddium_version on one
# classpath and the two generations are picked between at runtime.
sodium_backport_version = 0.9.2-SNAPSHOT+mc1.20.1-local

# Which Sodium the dev client (runClient) launches with: backport | legacy | none.
# Compilation always sees both generations regardless of this.
sodium_runtime = backport

# Load Create (plus Ponder, Vanillin, Flywheel and Registrate) in the DEV RUNTIME.
#
# Off by default because that stack dominates dev launch time, and the autotest suite launches the
# client dozens of times per measurement sweep -- every one of those paying for a mod nothing under
# test uses. Compilation is unaffected: the Create compat sources still build against modCompileOnly
# artifacts, so this cannot mask a compile break in that code.
#
# Set to true when actually testing Create compat in-game. VS2's ~150 Create mixins target classes
# that are simply absent without it, and Mixin skips those with a warning -- the same way this Forge
# run already skips the Fabric-only ones.
create_runtime = false

immptl_version=v3.3.9-mc1.20.1

# https://modrinth.com/mod/tis3d/version/MC1.20.1-fabric-1.7.7
tis3d_version = MC1.20.1-fabric-1.7.7

